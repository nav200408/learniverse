server.port=8084
server.servlet.context-path=/

# Redis Connection
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Resilience4J Circuit Breaker
resilience4j.circuitbreaker.instances.CircuitBreaker.slidingWindowSize=10
resilience4j.circuitbreaker.instances.CircuitBreaker.permittedNumberOfCallsInHalfOpenState=5
resilience4j.circuitbreaker.instances.CircuitBreaker.failureRateThreshold=50
resilience4j.circuitbreaker.instances.CircuitBreaker.waitDurationInOpenState=10000

# Resilience4J Time Limiter
resilience4j.timelimiter.instances.CircuitBreaker.timeoutDuration=3s