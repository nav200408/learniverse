version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: learniverse-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - microservice-net
    restart: unless-stopped

networks:
  microservice-net:
    external: true

volumes:
  redis_data:
