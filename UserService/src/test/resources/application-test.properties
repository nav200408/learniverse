# ---------------------------------------------------------
# 1. DISABLE CLOUD CONFIG
# ---------------------------------------------------------
# Completely disables the config server and overrides any
# spring.config.import statements from your main application.yml
spring.cloud.config.enabled=false
spring.config.import=

# ---------------------------------------------------------
# 2. IN-MEMORY DATABASE (H2)
# ---------------------------------------------------------
# Forces the test to use an isolated, in-memory database
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ---------------------------------------------------------
# 3. JPA / HIBERNATE SETTINGS
# ---------------------------------------------------------
# Explicitly tells Hibernate we are using H2, not MySQL
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ---------------------------------------------------------
# 4. DISABLE MIGRATION TOOLS
# ---------------------------------------------------------
# Prevents Flyway or Liquibase from trying to run against H2
spring.flyway.enabled=false
spring.liquibase.enabled=false